services:
  banco:
    image: postgres:19
    environment:
      POSTGRES_USER: spaceloop
      POSTGRES_PASSWORD: spaceloop
      POSTGRES_DB: spaceloop_db
    ports:
      - "5434:5432"
    volumes:
      - dados_do_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceloop -d spaceloop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_do_postgres:
